<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" font-family="Arial, Helvetica, sans-serif">
  <title>Street plan of Hillford town centre with buildings labelled A to H</title>
  <rect width="640" height="540" fill="#ffffff"/>
  <text x="20" y="30" font-size="18" font-weight="bold" fill="#333333">Hillford town centre</text>
  <!-- North arrow -->
  <g transform="translate(600,0)" fill="#555555" stroke="#555555">
    <line x1="0" y1="44" x2="0" y2="16" stroke-width="1.5"/>
    <polygon points="0,8 -6,20 6,20" stroke="none"/>
    <text x="0" y="58" font-size="12" text-anchor="middle" stroke="none">N</text>
  </g>

  <!-- Roads -->
  <g fill="#e9e9e9">
    <rect x="20" y="100" width="600" height="30"/>
    <rect x="20" y="270" width="600" height="30"/>
    <rect x="185" y="100" width="30" height="402"/>
    <rect x="435" y="100" width="30" height="402"/>
    <circle cx="450" cy="285" r="25"/>
  </g>
  <!-- Roundabout island -->
  <circle cx="450" cy="285" r="10" fill="#ffffff" stroke="#999999" stroke-width="1"/>

  <!-- Road names -->
  <g font-size="11" fill="#555555" text-anchor="middle">
    <text x="100" y="119">Station Road</text>
    <text x="560" y="119">Station Road</text>
    <text x="100" y="289">High Street</text>
    <text x="330" y="289">High Street</text>
    <text x="560" y="289">High Street</text>
    <text x="0" y="0" transform="translate(204,395) rotate(-90)">Mill Road</text>
    <text x="0" y="0" transform="translate(454,395) rotate(-90)">Park Lane</text>
    <text x="0" y="0" transform="translate(204,205) rotate(-90)">Mill Road</text>
    <text x="0" y="0" transform="translate(454,205) rotate(-90)">Park Lane</text>
  </g>

  <!-- Traffic lights at Mill Road and High Street -->
  <g>
    <rect x="195" y="272" width="10" height="26" rx="2" fill="#555555"/>
    <circle cx="200" cy="278" r="3" fill="#e57373"/>
    <circle cx="200" cy="285" r="3" fill="#ffd54f"/>
    <circle cx="200" cy="292" r="3" fill="#81c784"/>
  </g>

  <!-- Named places -->
  <g fill="#f5f5f5" stroke="#999999" stroke-width="1">
    <rect x="240" y="50" width="180" height="42"/>
    <rect x="472" y="138" width="60" height="40"/>
    <rect x="118" y="308" width="60" height="40"/>
    <rect x="222" y="308" width="60" height="40"/>
  </g>
  <rect x="480" y="310" width="140" height="190" fill="#f1f6ee" stroke="#b5c4ad" stroke-width="1"/>
  <g fill="none" stroke="#b5c4ad" stroke-width="1">
    <circle cx="510" cy="350" r="10"/><circle cx="585" cy="345" r="10"/>
    <circle cx="530" cy="460" r="10"/><circle cx="595" cy="470" r="10"/>
  </g>
  <g font-size="12" fill="#444444" text-anchor="middle">
    <text x="330" y="76">Train station</text>
    <text x="502" y="162">Church</text>
    <text x="148" y="332">Bank</text>
    <text x="252" y="332">Cinema</text>
    <text x="550" y="410" font-style="italic">Park</text>
  </g>

  <!-- Lettered buildings -->
  <g fill="#ffffff" stroke="#777777" stroke-width="1.2">
    <rect x="222" y="440" width="60" height="40"/>
    <rect x="118" y="440" width="60" height="40"/>
    <rect x="118" y="222" width="60" height="40"/>
    <rect x="222" y="222" width="60" height="40"/>
    <rect x="300" y="222" width="60" height="40"/>
    <rect x="300" y="308" width="60" height="40"/>
    <rect x="472" y="222" width="60" height="40"/>
    <rect x="222" y="138" width="60" height="40"/>
  </g>
  <g font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">
    <text x="252" y="466">A</text>
    <text x="148" y="466">B</text>
    <text x="148" y="248">C</text>
    <text x="252" y="248">D</text>
    <text x="330" y="248">E</text>
    <text x="330" y="334">F</text>
    <text x="502" y="248">G</text>
    <text x="252" y="164">H</text>
  </g>

  <!-- Key -->
  <g>
    <rect x="30" y="468" width="8" height="20" rx="2" fill="#555555"/>
    <circle cx="34" cy="473" r="2.2" fill="#e57373"/>
    <circle cx="34" cy="478" r="2.2" fill="#ffd54f"/>
    <circle cx="34" cy="483" r="2.2" fill="#81c784"/>
    <text x="46" y="482" font-size="11" fill="#555555">Traffic lights</text>
    <circle cx="34" cy="448" r="8" fill="#e9e9e9"/>
    <circle cx="34" cy="448" r="3.5" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="46" y="452" font-size="11" fill="#555555">Roundabout</text>
  </g>

  <!-- Start point -->
  <polygon points="200,488 192,502 208,502" fill="#555555"/>
  <text x="200" y="522" font-size="12" fill="#555555" text-anchor="middle">You are here (facing north)</text>
</svg>
