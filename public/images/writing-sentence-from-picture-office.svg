<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A meeting in an office</title>
  <desc id="desc">Three people are in a meeting room. On the left, a man in a blue shirt is standing next to a large screen on the wall and pointing at a bar chart on it. At a white table, a woman in a red jacket is typing on a laptop, and a man in a grey jumper is holding a cup. There is a plant in the corner and a clock on the wall.</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Floor -->
  <rect x="0" y="420" width="800" height="80" fill="#f3f4f6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#9ca3af" stroke-width="2"/>

  <!-- Screen with a bar chart -->
  <rect x="40" y="50" width="280" height="175" rx="6" fill="#ffffff" stroke="#374151" stroke-width="8"/>
  <text x="180" y="82" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#374151" text-anchor="middle">SALES</text>
  <line x1="75" y1="95" x2="75" y2="200" stroke="#6b7280" stroke-width="3"/>
  <line x1="75" y1="200" x2="290" y2="200" stroke="#6b7280" stroke-width="3"/>
  <g fill="#3b82f6">
    <rect x="95" y="160" width="32" height="40"/>
    <rect x="145" y="140" width="32" height="60"/>
    <rect x="195" y="120" width="32" height="80"/>
    <rect x="245" y="100" width="32" height="100"/>
  </g>

  <!-- Clock -->
  <circle cx="560" cy="80" r="28" fill="#ffffff" stroke="#6b7280" stroke-width="3"/>
  <line x1="560" y1="80" x2="560" y2="60" stroke="#374151" stroke-width="3" stroke-linecap="round"/>
  <line x1="560" y1="80" x2="574" y2="88" stroke="#374151" stroke-width="4" stroke-linecap="round"/>

  <!-- Plant in the corner -->
  <g transform="translate(-14 0)">
  <g fill="#4ade80">
    <ellipse cx="742" cy="300" rx="16" ry="40" transform="rotate(-25 742 300)"/>
    <ellipse cx="770" cy="295" rx="16" ry="42"/>
    <ellipse cx="796" cy="300" rx="16" ry="40" transform="rotate(25 796 300)"/>
  </g>
  <path d="M745 340 L795 340 L788 420 L752 420 Z" fill="#b45309"/>
  </g>

  <!-- Man standing and pointing at the chart -->
  <rect x="363" y="318" width="16" height="100" fill="#1f2937"/>
  <rect x="387" y="318" width="16" height="100" fill="#1f2937"/>
  <ellipse cx="369" cy="419" rx="13" ry="5" fill="#111827"/>
  <ellipse cx="397" cy="419" rx="13" ry="5" fill="#111827"/>
  <rect x="358" y="222" width="50" height="104" rx="12" fill="#3b82f6"/>
  <circle cx="383" cy="198" r="23" fill="#8d5524"/>
  <path d="M360 198 A23 23 0 0 1 406 198 Q383 181 360 198 Z" fill="#111827"/>
  <line x1="364" y1="236" x2="300" y2="180" stroke="#3b82f6" stroke-width="11" stroke-linecap="round"/>
  <circle cx="296" cy="177" r="7" fill="#8d5524"/>
  <line x1="292" y1="173" x2="282" y2="164" stroke="#8d5524" stroke-width="4" stroke-linecap="round"/>
  <line x1="404" y1="238" x2="414" y2="300" stroke="#3b82f6" stroke-width="11" stroke-linecap="round"/>
  <circle cx="414" cy="304" r="7" fill="#8d5524"/>

  <!-- Chair backs -->
  <rect x="488" y="250" width="70" height="80" rx="8" fill="#9ca3af"/>
  <rect x="628" y="250" width="70" height="80" rx="8" fill="#9ca3af"/>

  <!-- Woman in a red jacket at the laptop -->
  <rect x="499" y="262" width="48" height="72" rx="12" fill="#dc2626"/>
  <path d="M500 240 A23 23 0 0 1 546 240 L548 275 L498 275 Z" fill="#7c2d12"/>
  <circle cx="523" cy="238" r="21" fill="#f1c7a3"/>
  <path d="M502 236 A21 21 0 0 1 544 236 Q523 220 502 236 Z" fill="#7c2d12"/>
  <line x1="503" y1="276" x2="500" y2="320" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>
  <line x1="543" y1="276" x2="546" y2="320" stroke="#dc2626" stroke-width="10" stroke-linecap="round"/>

  <!-- Man in a grey jumper holding a cup -->
  <rect x="639" y="262" width="48" height="72" rx="12" fill="#6b7280"/>
  <circle cx="663" cy="238" r="21" fill="#c68c5a"/>
  <path d="M642 236 A21 21 0 0 1 684 236 Q663 222 642 236 Z" fill="#374151"/>
  <line x1="682" y1="276" x2="690" y2="300" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/>
  <line x1="690" y1="300" x2="676" y2="296" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/>
  <rect x="664" y="282" width="16" height="20" rx="2" fill="#ffffff" stroke="#374151" stroke-width="2"/>
  <path d="M664 287 Q656 292 664 298" fill="none" stroke="#374151" stroke-width="2"/>
  <circle cx="676" cy="297" r="6" fill="#c68c5a"/>
  <line x1="644" y1="276" x2="640" y2="320" stroke="#6b7280" stroke-width="10" stroke-linecap="round"/>

  <!-- Table -->
  <rect x="440" y="322" width="270" height="14" rx="3" fill="#f9fafb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="460" y="336" width="10" height="84" fill="#9ca3af"/>
  <rect x="685" y="336" width="10" height="84" fill="#9ca3af"/>

  <!-- Laptop (back of the screen towards us) -->
  <rect x="501" y="286" width="44" height="34" rx="3" fill="#d1d5db" stroke="#6b7280" stroke-width="2"/>
  <circle cx="523" cy="303" r="4" fill="#9ca3af"/>
  <rect x="495" y="318" width="56" height="5" rx="2" fill="#6b7280"/>

  <!-- Notebook and pen on the table -->
  <rect x="600" y="314" width="34" height="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
</svg>
