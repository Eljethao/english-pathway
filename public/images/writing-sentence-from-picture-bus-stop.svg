<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A bus stop on a rainy day</title>
  <desc id="desc">A rainy street. On the left, a red bus with the number 24 is coming towards a bus stop. At the bus stop, a man in a green coat is holding a black umbrella over his head. Next to him, a woman in a yellow raincoat is standing under the roof of a bus shelter and looking at her phone. There are grey clouds in the sky.</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Clouds -->
  <g fill="#d1d5db">
    <ellipse cx="120" cy="48" rx="70" ry="24"/>
    <ellipse cx="170" cy="36" rx="50" ry="22"/>
    <ellipse cx="400" cy="44" rx="80" ry="24"/>
    <ellipse cx="450" cy="32" rx="50" ry="20"/>
    <ellipse cx="680" cy="50" rx="75" ry="24"/>
    <ellipse cx="630" cy="38" rx="45" ry="20"/>
  </g>

  <!-- Rain -->
  <g stroke="#93c5fd" stroke-width="2" stroke-linecap="round">
    <line x1="60" y1="90" x2="54" y2="106"/>
    <line x1="140" y1="110" x2="134" y2="126"/>
    <line x1="220" y1="85" x2="214" y2="101"/>
    <line x1="300" y1="120" x2="294" y2="136"/>
    <line x1="90" y1="170" x2="84" y2="186"/>
    <line x1="180" y1="190" x2="174" y2="206"/>
    <line x1="260" y1="165" x2="254" y2="181"/>
    <line x1="340" y1="200" x2="334" y2="216"/>
    <line x1="40" y1="230" x2="34" y2="246"/>
    <line x1="360" y1="95" x2="354" y2="111"/>
    <line x1="420" y1="110" x2="414" y2="126"/>
    <line x1="470" y1="80" x2="464" y2="96"/>
    <line x1="560" y1="95" x2="554" y2="111"/>
    <line x1="610" y1="120" x2="604" y2="136"/>
    <line x1="700" y1="100" x2="694" y2="116"/>
    <line x1="760" y1="125" x2="754" y2="141"/>
    <line x1="660" y1="140" x2="654" y2="156"/>
    <line x1="440" y1="250" x2="434" y2="266"/>
    <line x1="455" y1="320" x2="449" y2="336"/>
    <line x1="560" y1="260" x2="554" y2="276"/>
    <line x1="550" y1="340" x2="544" y2="356"/>
    <line x1="380" y1="300" x2="374" y2="316"/>
    <line x1="790" y1="200" x2="784" y2="216"/>
    <line x1="790" y1="300" x2="784" y2="316"/>
  </g>

  <!-- Road and pavement -->
  <rect x="0" y="425" width="800" height="75" fill="#e5e7eb"/>
  <line x1="0" y1="470" x2="800" y2="470" stroke="#ffffff" stroke-width="4" stroke-dasharray="30 20"/>
  <rect x="380" y="400" width="420" height="25" fill="#d1d5db"/>
  <line x1="380" y1="400" x2="800" y2="400" stroke="#9ca3af" stroke-width="2"/>
  <ellipse cx="200" cy="485" rx="60" ry="7" fill="#bfdbfe"/>

  <!-- Bus (moving right, towards the stop) -->
  <rect x="20" y="245" width="340" height="190" rx="16" fill="#dc2626"/>
  <rect x="20" y="395" width="340" height="12" fill="#b91c1c"/>
  <g fill="#e0f2fe" stroke="#991b1b" stroke-width="2">
    <rect x="40" y="275" width="55" height="60" rx="4"/>
    <rect x="105" y="275" width="55" height="60" rx="4"/>
    <rect x="170" y="275" width="55" height="60" rx="4"/>
    <rect x="300" y="275" width="50" height="95" rx="4"/>
  </g>
  <rect x="240" y="280" width="48" height="140" rx="3" fill="#fecaca" stroke="#991b1b" stroke-width="2"/>
  <line x1="264" y1="280" x2="264" y2="420" stroke="#991b1b" stroke-width="2"/>
  <rect x="296" y="252" width="56" height="18" rx="2" fill="#111827"/>
  <text x="324" y="266" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#facc15" text-anchor="middle">24</text>
  <circle cx="352" cy="395" r="7" fill="#fde68a"/>
  <circle cx="90" cy="435" r="25" fill="#374151"/>
  <circle cx="90" cy="435" r="10" fill="#9ca3af"/>
  <circle cx="290" cy="435" r="25" fill="#374151"/>
  <circle cx="290" cy="435" r="10" fill="#9ca3af"/>

  <!-- Bus stop sign -->
  <rect x="402" y="170" width="6" height="230" fill="#6b7280"/>
  <rect x="376" y="140" width="58" height="40" rx="5" fill="#1d4ed8"/>
  <text x="405" y="166" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">BUS</text>

  <!-- Bus shelter -->
  <rect x="594" y="190" width="174" height="170" fill="#dbeafe" opacity="0.6"/>
  <rect x="580" y="176" width="202" height="14" rx="3" fill="#4b5563"/>
  <rect x="588" y="190" width="6" height="210" fill="#6b7280"/>
  <rect x="768" y="190" width="6" height="210" fill="#6b7280"/>

  <!-- Man with umbrella -->
  <rect x="480" y="325" width="15" height="75" fill="#1f2937"/>
  <rect x="502" y="325" width="15" height="75" fill="#1f2937"/>
  <ellipse cx="486" cy="400" rx="12" ry="5" fill="#111827"/>
  <ellipse cx="510" cy="400" rx="12" ry="5" fill="#111827"/>
  <rect x="474" y="244" width="50" height="92" rx="12" fill="#16a34a"/>
  <circle cx="499" cy="222" r="22" fill="#c68c5a"/>
  <path d="M477 222 A22 22 0 0 1 521 222 Q499 206 477 222 Z" fill="#3f2a1d"/>
  <line x1="520" y1="256" x2="536" y2="286" stroke="#16a34a" stroke-width="11" stroke-linecap="round"/>
  <circle cx="537" cy="288" r="7" fill="#c68c5a"/>
  <line x1="537" y1="288" x2="518" y2="110" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <path d="M436 158 Q518 50 600 158 Q579 146 559 158 Q539 146 518 158 Q497 146 477 158 Q457 146 436 158 Z" fill="#111827"/>
  <line x1="518" y1="104" x2="518" y2="94" stroke="#111827" stroke-width="4" stroke-linecap="round"/>

  <!-- Woman in a yellow raincoat, looking at her phone -->
  <rect x="664" y="330" width="14" height="70" fill="#374151"/>
  <rect x="686" y="330" width="14" height="70" fill="#374151"/>
  <ellipse cx="670" cy="400" rx="11" ry="5" fill="#111827"/>
  <ellipse cx="694" cy="400" rx="11" ry="5" fill="#111827"/>
  <path d="M656 250 L708 250 L716 342 L648 342 Z" fill="#facc15"/>
  <circle cx="682" cy="226" r="27" fill="#eab308"/>
  <circle cx="682" cy="228" r="20" fill="#f1c7a3"/>
  <path d="M659 260 L652 300 L672 290" fill="none" stroke="#ca8a04" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M705 260 L712 300 L692 290" fill="none" stroke="#ca8a04" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="673" y="276" width="18" height="28" rx="3" fill="#111827"/>
  <rect x="676" y="280" width="12" height="20" fill="#60a5fa"/>
</svg>
