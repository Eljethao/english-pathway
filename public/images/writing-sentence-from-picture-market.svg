<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A fruit stall at an outdoor market</title>
  <desc id="desc">An outdoor fruit market. A stall with a green and white striped roof has three boxes of fruit on it: red apples, oranges and bananas. A small sign on the apples says £2. Behind the stall, a seller in a white apron is handing a paper bag of apples to a customer. The customer is a man with a blue backpack. On the right, a woman with a shopping basket is waiting for her turn.</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Ground -->
  <rect x="0" y="420" width="800" height="80" fill="#f3f4f6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#9ca3af" stroke-width="2"/>

  <!-- Striped roof -->
  <g>
    <rect x="60" y="50" width="58" height="60" fill="#16a34a"/>
    <rect x="118" y="50" width="58" height="60" fill="#ffffff"/>
    <rect x="176" y="50" width="58" height="60" fill="#16a34a"/>
    <rect x="234" y="50" width="58" height="60" fill="#ffffff"/>
    <rect x="292" y="50" width="58" height="60" fill="#16a34a"/>
    <rect x="350" y="50" width="58" height="60" fill="#ffffff"/>
    <rect x="408" y="50" width="58" height="60" fill="#16a34a"/>
    <rect x="466" y="50" width="58" height="60" fill="#ffffff"/>
    <rect x="60" y="50" width="464" height="60" fill="none" stroke="#15803d" stroke-width="3"/>
    <path d="M60 110 Q89 130 118 110 Q147 130 176 110 Q205 130 234 110 Q263 130 292 110 Q321 130 350 110 Q379 130 408 110 Q437 130 466 110 Q495 130 524 110" fill="#16a34a" stroke="#15803d" stroke-width="3"/>
  </g>
  <rect x="68" y="118" width="8" height="302" fill="#6b7280"/>
  <rect x="508" y="118" width="8" height="302" fill="#6b7280"/>

  <!-- Seller behind the stall -->
  <rect x="416" y="194" width="48" height="96" rx="12" fill="#22c55e"/>
  <rect x="424" y="212" width="32" height="78" rx="4" fill="#ffffff" stroke="#d1d5db" stroke-width="2"/>
  <circle cx="440" cy="172" r="22" fill="#c68c5a"/>
  <path d="M418 172 A22 22 0 0 1 462 172 Q440 156 418 172 Z" fill="#111827"/>
  <line x1="460" y1="210" x2="536" y2="232" stroke="#22c55e" stroke-width="11" stroke-linecap="round"/>
  <circle cx="539" cy="233" r="7" fill="#c68c5a"/>

  <!-- Paper bag of apples -->
  <circle cx="552" cy="226" r="8" fill="#dc2626"/>
  <circle cx="564" cy="228" r="7" fill="#dc2626"/>
  <path d="M540 230 L576 230 L580 274 L536 274 Z" fill="#d4a373" stroke="#a16207" stroke-width="2"/>

  <!-- Stall counter -->
  <rect x="70" y="280" width="440" height="14" fill="#a47148"/>
  <rect x="80" y="294" width="420" height="126" fill="#d6b48c" stroke="#a47148" stroke-width="2"/>
  <line x1="80" y1="336" x2="500" y2="336" stroke="#a47148" stroke-width="2"/>
  <line x1="80" y1="378" x2="500" y2="378" stroke="#a47148" stroke-width="2"/>

  <!-- Box of apples -->
  <g fill="#dc2626">
    <circle cx="112" cy="246" r="11"/>
    <circle cx="134" cy="246" r="11"/>
    <circle cx="156" cy="246" r="11"/>
    <circle cx="178" cy="246" r="11"/>
    <circle cx="123" cy="236" r="11"/>
    <circle cx="167" cy="236" r="11"/>
  </g>
  <rect x="98" y="248" width="96" height="32" fill="#c08457" stroke="#92400e" stroke-width="2"/>
  <line x1="145" y1="236" x2="145" y2="214" stroke="#6b7280" stroke-width="3"/>
  <rect x="122" y="190" width="46" height="28" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <text x="145" y="210" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#111827" text-anchor="middle">£2</text>

  <!-- Box of oranges -->
  <g fill="#f97316">
    <circle cx="222" cy="246" r="11"/>
    <circle cx="244" cy="246" r="11"/>
    <circle cx="266" cy="246" r="11"/>
    <circle cx="288" cy="246" r="11"/>
    <circle cx="233" cy="236" r="11"/>
    <circle cx="277" cy="236" r="11"/>
  </g>
  <rect x="208" y="248" width="96" height="32" fill="#c08457" stroke="#92400e" stroke-width="2"/>

  <!-- Box of bananas -->
  <g fill="none" stroke="#facc15" stroke-width="9" stroke-linecap="round">
    <path d="M326 240 Q350 256 374 236"/>
    <path d="M336 232 Q360 248 384 228"/>
    <path d="M346 242 Q370 258 394 238"/>
  </g>
  <rect x="318" y="248" width="86" height="32" fill="#c08457" stroke="#92400e" stroke-width="2"/>

  <!-- Customer with a blue backpack -->
  <rect x="587" y="330" width="15" height="88" fill="#1f2937"/>
  <rect x="608" y="330" width="15" height="88" fill="#1f2937"/>
  <ellipse cx="592" cy="419" rx="12" ry="5" fill="#111827"/>
  <ellipse cx="616" cy="419" rx="12" ry="5" fill="#111827"/>
  <rect x="622" y="238" width="30" height="70" rx="8" fill="#1d4ed8"/>
  <rect x="580" y="228" width="50" height="108" rx="12" fill="#9ca3af"/>
  <line x1="622" y1="232" x2="626" y2="300" stroke="#1e3a8a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="605" cy="206" r="22" fill="#f1c7a3"/>
  <path d="M583 206 A22 22 0 0 1 627 206 Q605 190 583 206 Z" fill="#78350f"/>
  <line x1="584" y1="244" x2="576" y2="256" stroke="#9ca3af" stroke-width="11" stroke-linecap="round"/>
  <circle cx="574" cy="258" r="7" fill="#f1c7a3"/>

  <!-- Woman with a shopping basket, waiting -->
  <rect x="709" y="340" width="14" height="78" fill="#374151"/>
  <rect x="731" y="340" width="14" height="78" fill="#374151"/>
  <ellipse cx="715" cy="419" rx="11" ry="5" fill="#111827"/>
  <ellipse cx="739" cy="419" rx="11" ry="5" fill="#111827"/>
  <path d="M703 242 L751 242 L760 346 L694 346 Z" fill="#a855f7"/>
  <path d="M705 216 A22 22 0 0 1 749 216 L751 254 L703 254 Z" fill="#3f2a1d"/>
  <circle cx="727" cy="218" r="20" fill="#e0ac69"/>
  <path d="M707 214 A20 20 0 0 1 747 214 Q727 200 707 214 Z" fill="#3f2a1d"/>
  <line x1="704" y1="256" x2="690" y2="300" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
  <circle cx="689" cy="303" r="6" fill="#e0ac69"/>
  <path d="M672 316 Q689 282 706 316" fill="none" stroke="#92400e" stroke-width="4"/>
  <path d="M666 314 L712 314 L704 344 L674 344 Z" fill="#c08457" stroke="#92400e" stroke-width="2"/>
  <line x1="750" y1="256" x2="758" y2="320" stroke="#a855f7" stroke-width="10" stroke-linecap="round"/>
</svg>
