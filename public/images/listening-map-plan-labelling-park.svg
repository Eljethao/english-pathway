<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 490" width="640" height="490" font-family="Arial, Helvetica, sans-serif">
  <title>Map of Hollybrook Country Park with places labelled A to H</title>
  <rect width="640" height="490" fill="#ffffff"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#333333">Hollybrook Country Park</text>
  <!-- North arrow -->
  <g transform="translate(600,0)" fill="#555555" stroke="#555555">
    <line x1="0" y1="44" x2="0" y2="16" stroke-width="1.5"/>
    <polygon points="0,8 -6,20 6,20" stroke="none"/>
    <text x="0" y="58" font-size="12" text-anchor="middle" stroke="none">N</text>
  </g>
  <g transform="translate(0,20)">
    <!-- Park boundary -->
    <rect x="20" y="50" width="600" height="380" fill="none" stroke="#999999" stroke-width="1.5"/>
    <!-- Woodland -->
    <g fill="none" stroke="#b5b5b5" stroke-width="1">
      <circle cx="55" cy="80" r="9"/><circle cx="85" cy="72" r="9"/><circle cx="115" cy="84" r="9"/>
      <circle cx="140" cy="70" r="9"/><circle cx="60" cy="112" r="9"/><circle cx="92" cy="106" r="9"/>
      <circle cx="125" cy="116" r="9"/><circle cx="50" cy="146" r="9"/><circle cx="82" cy="142" r="9"/>
      <circle cx="112" cy="150" r="9"/>
    </g>
    <text x="95" y="180" font-size="12" font-style="italic" fill="#777777" text-anchor="middle">Woodland</text>
    <!-- Paths: grey outline then white fill -->
    <g fill="none" stroke="#bdbdbd" stroke-width="18">
      <line x1="320" y1="430" x2="320" y2="300"/>
      <line x1="20" y1="345" x2="620" y2="345"/>
      <ellipse cx="320" cy="210" rx="150" ry="95"/>
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="15">
      <line x1="320" y1="432" x2="320" y2="300"/>
      <line x1="18" y1="345" x2="622" y2="345"/>
      <ellipse cx="320" cy="210" rx="150" ry="95"/>
    </g>
    <!-- Lake -->
    <ellipse cx="320" cy="210" rx="112" ry="62" fill="#eef3f7" stroke="#9aa9b5" stroke-width="1"/>
    <text x="320" y="215" font-size="14" font-style="italic" fill="#6b7c89" text-anchor="middle">Lake</text>
    <!-- Car park -->
    <rect x="40" y="370" width="140" height="48" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
    <text x="110" y="399" font-size="12" fill="#555555" text-anchor="middle">Car park</text>
    <!-- Lettered places -->
    <g fill="#ffffff" stroke="#777777" stroke-width="1.2">
      <rect x="345" y="365" width="50" height="40"/>
      <rect x="245" y="365" width="50" height="40"/>
      <rect x="510" y="295" width="55" height="35"/>
      <rect x="510" y="365" width="55" height="40"/>
      <rect x="297" y="66" width="46" height="32"/>
      <rect x="100" y="195" width="46" height="32"/>
      <rect x="494" y="195" width="46" height="32"/>
      <rect x="180" y="304" width="46" height="28"/>
    </g>
    <g font-size="16" font-weight="bold" fill="#333333" text-anchor="middle">
      <text x="370" y="391">A</text>
      <text x="270" y="391">B</text>
      <text x="537" y="318">C</text>
      <text x="537" y="391">D</text>
      <text x="320" y="88">E</text>
      <text x="123" y="217">F</text>
      <text x="517" y="217">G</text>
      <text x="203" y="324">H</text>
    </g>
    <!-- Entrance -->
    <rect x="309" y="426" width="22" height="8" fill="#ffffff"/>
    <polygon points="320,436 313,448 327,448" fill="#555555"/>
    <text x="320" y="464" font-size="12" fill="#555555" text-anchor="middle">Main entrance (you are here)</text>
  </g>
</svg>
