  <line x1="450" y1="262" x2="468" y2="318" stroke="#7c3aed" stroke-width="10" stroke-linecap="round"/>
  <circle cx="469" cy="321" r="6" fill="#8d5524"/>
  <path d="M470 323 Q500 380 534 392" fill="none" stroke="#dc2626" stroke-width="2.5"/>

  <!-- Small brown dog -->
  <ellipse cx="552" cy="404" rx="26" ry="12" fill="#92400e"/>
  <circle cx="578" cy="392" r="11" fill="#92400e"/>
  <ellipse cx="584" cy="382" rx="4" ry="7" fill="#78350f"/>
  <circle cx="589" cy="395" r="3" fill="#111827"/>
  <line x1="534" y1="394" x2="532" y2="392" stroke="#dc2626" stroke-width="3"/>
  <g stroke="#92400e" stroke-width="5" stroke-linecap="round">
    <line x1="534" y1="412" x2="532" y2="428"/>
    <line x1="548" y1="413" x2="548" y2="429"/>
    <line x1="560" y1="413" x2="562" y2="429"/>
    <line x1="572" y1="410" x2="575" y2="428"/>
    <line x1="527" y1="400" x2="516" y2="388"/>
  </g>

  <!-- Boy riding a bicycle -->
  <circle cx="655" cy="420" r="26" fill="none" stroke="#1f2937" stroke-width="5"/>
  <circle cx="750" cy="420" r="26" fill="none" stroke="#1f2937" stroke-width="5"/>
  <path d="M655 420 L690 380 L735 380 L750 420 M690 380 L703 420 L735 380 M703 420 L655 420" fill="none" stroke="#0ea5e9" stroke-width="5" stroke-linejoin="round"/>
