  <!-- Woman walking a dog -->
  <rect x="410" y="335" width="14" height="80" fill="#374151"/>
  <rect x="432" y="335" width="14" height="80" fill="#374151"/>
  <ellipse cx="416" cy="416" rx="11" ry="5" fill="#111827"/>
  <ellipse cx="440" cy="416" rx="11" ry="5" fill="#111827"/>
  <path d="M404 250 L452 250 L460 345 L396 345 Z" fill="#7c3aed"/>
  <circle cx="428" cy="226" r="22" fill="#8d5524"/>
  <path d="M406 226 A22 22 0 0 1 450 226 L452 250 L404 250 Z" fill="#111827"/>
