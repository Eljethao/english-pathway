  <rect x="680" y="372" width="22" height="7" rx="3" fill="#1f2937"/>
  <path d="M694 372 L712 398 L703 420" fill="none" stroke="#1e3a8a" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="678" y="306" width="36" height="66" rx="10" fill="#ef4444"/>
