<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" width="940" height="430" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>Kelby harbour in 2000 and today</title>
  <defs>
    <marker id="n-arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <path id="boat" d="M0,0 h22 l-5,7 h-12 z" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  </defs>
  <rect width="940" height="430" fill="#ffffff"/>

  <text x="235" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">2000</text>
  <text x="705" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#111827">Today</text>

  <!-- ===================== 2000 ===================== -->
  <g transform="translate(20,50)">
    <rect x="0" y="0" width="430" height="360" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <!-- sea -->
    <rect x="0.5" y="255" width="429" height="104.5" fill="#eef2f6"/>
    <line x1="0" y1="255" x2="430" y2="255" stroke="#6b7280" stroke-width="1.2"/>
    <text x="410" y="348" text-anchor="end" font-size="13" font-style="italic" fill="#6b7280">Sea</text>
    <!-- north arrow -->
    <line x1="25" y1="62" x2="25" y2="30" stroke="#6b7280" stroke-width="1.2" marker-end="url(#n-arrow)"/>
    <text x="25" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">N</text>
    <!-- open land -->
    <rect x="230" y="20" width="180" height="58" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>
    <text x="320" y="54" text-anchor="middle" font-size="13" fill="#111827">Open land</text>
    <!-- road -->
    <line x1="0" y1="92" x2="430" y2="92" stroke="#9ca3af" stroke-width="1"/>
    <line x1="0" y1="116" x2="430" y2="116" stroke="#9ca3af" stroke-width="1"/>
    <text x="110" y="108" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">Harbour Road</text>
    <!-- fish market -->
    <rect x="20" y="135" width="115" height="90" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="77" y="184" text-anchor="middle" font-size="13" fill="#111827">Fish market</text>
    <!-- car park -->
    <rect x="160" y="135" width="120" height="90" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <g stroke="#d1d5db" stroke-width="1">
      <line x1="175" y1="135" x2="175" y2="155"/><line x1="190" y1="135" x2="190" y2="155"/><line x1="205" y1="135" x2="205" y2="155"/>
      <line x1="235" y1="135" x2="235" y2="155"/><line x1="250" y1="135" x2="250" y2="155"/><line x1="265" y1="135" x2="265" y2="155"/>
      <line x1="175" y1="205" x2="175" y2="225"/><line x1="190" y1="205" x2="190" y2="225"/><line x1="205" y1="205" x2="205" y2="225"/>
      <line x1="235" y1="205" x2="235" y2="225"/><line x1="250" y1="205" x2="250" y2="225"/><line x1="265" y1="205" x2="265" y2="225"/>
    </g>
    <text x="220" y="184" text-anchor="middle" font-size="13" fill="#111827">Car park</text>
    <!-- warehouses -->
    <rect x="300" y="135" width="115" height="90" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <g stroke="#9ca3af" stroke-width="1">
      <line x1="338" y1="135" x2="338" y2="165"/><line x1="377" y1="135" x2="377" y2="165"/>
      <line x1="338" y1="198" x2="338" y2="225"/><line x1="377" y1="198" x2="377" y2="225"/>
    </g>
    <text x="357" y="186" text-anchor="middle" font-size="13" fill="#111827">Warehouses</text>
    <!-- pier and lighthouse -->
    <rect x="205" y="255" width="20" height="74" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="198" y="300" text-anchor="end" font-size="12" fill="#4b5563">Pier</text>
    <circle cx="215" cy="340" r="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="229" y="344" font-size="12" fill="#4b5563">Lighthouse</text>
    <!-- fishing boats -->
    <use href="#boat" x="234" y="268"/>
    <use href="#boat" x="234" y="290"/>
    <use href="#boat" x="234" y="312"/>
    <text x="264" y="296" font-size="12" fill="#4b5563">Fishing boats</text>
  </g>

  <!-- ===================== TODAY ===================== -->
  <g transform="translate(490,50)">
    <rect x="0" y="0" width="430" height="360" fill="#ffffff" stroke="#9ca3af" stroke-width="1"/>
    <!-- sea -->
    <rect x="0.5" y="255" width="429" height="104.5" fill="#eef2f6"/>
    <line x1="0" y1="255" x2="430" y2="255" stroke="#6b7280" stroke-width="1.2"/>
    <text x="410" y="348" text-anchor="end" font-size="13" font-style="italic" fill="#6b7280">Sea</text>
    <!-- north arrow -->
    <line x1="25" y1="62" x2="25" y2="30" stroke="#6b7280" stroke-width="1.2" marker-end="url(#n-arrow)"/>
    <text x="25" y="22" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">N</text>
    <!-- multi-storey car park -->
    <rect x="230" y="20" width="180" height="58" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="320" y="45" text-anchor="middle" font-size="13" fill="#111827">Multi-storey</text>
    <text x="320" y="63" text-anchor="middle" font-size="13" fill="#111827">car park</text>
    <!-- road -->
    <line x1="0" y1="92" x2="430" y2="92" stroke="#9ca3af" stroke-width="1"/>
    <line x1="0" y1="116" x2="430" y2="116" stroke="#9ca3af" stroke-width="1"/>
    <text x="110" y="108" text-anchor="middle" font-size="12" font-style="italic" fill="#4b5563">Harbour Road</text>
    <!-- food hall -->
    <rect x="20" y="135" width="115" height="90" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="77" y="184" text-anchor="middle" font-size="13" fill="#111827">Food hall</text>
    <!-- public square -->
    <rect x="160" y="135" width="120" height="90" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="220" y="163" text-anchor="middle" font-size="13" fill="#111827">Public square</text>
    <g fill="#ffffff" stroke="#9ca3af" stroke-width="1">
      <circle cx="174" cy="148" r="6"/><circle cx="266" cy="148" r="6"/>
      <circle cx="174" cy="212" r="6"/><circle cx="266" cy="212" r="6"/>
    </g>
    <circle cx="220" cy="190" r="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <circle cx="220" cy="190" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text x="220" y="216" text-anchor="middle" font-size="10" fill="#4b5563">fountain</text>
    <text x="268" y="232" font-size="9" fill="#9ca3af">trees</text>
    <!-- apartments -->
    <rect x="300" y="135" width="115" height="90" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <g stroke="#9ca3af" stroke-width="1">
      <line x1="338" y1="135" x2="338" y2="162"/><line x1="377" y1="135" x2="377" y2="162"/>
      <line x1="338" y1="204" x2="338" y2="225"/><line x1="377" y1="204" x2="377" y2="225"/>
    </g>
    <text x="357" y="179" text-anchor="middle" font-size="13" fill="#111827">Apartments</text>
    <text x="357" y="196" text-anchor="middle" font-size="13" fill="#111827">and cafés</text>
    <!-- promenade -->
    <rect x="0.5" y="238" width="429" height="13" fill="#ffffff" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="70" y="248.5" text-anchor="middle" font-size="10" fill="#4b5563">Promenade</text>
    <!-- pier and lighthouse -->
    <rect x="205" y="255" width="20" height="74" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2"/>
    <text x="232" y="300" font-size="12" fill="#4b5563">Pier</text>
    <circle cx="215" cy="340" r="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.2"/>
    <text x="229" y="344" font-size="12" fill="#4b5563">Lighthouse</text>
    <!-- marina -->
    <g stroke="#6b7280" stroke-width="1.5">
      <line x1="100" y1="255" x2="100" y2="282"/>
      <line x1="35" y1="282" x2="170" y2="282"/>
      <line x1="45" y1="282" x2="45" y2="300"/>
      <line x1="75" y1="282" x2="75" y2="300"/>
      <line x1="125" y1="282" x2="125" y2="300"/>
      <line x1="155" y1="282" x2="155" y2="300"/>
    </g>
    <use href="#boat" x="49" y="289"/>
    <use href="#boat" x="129" y="289"/>
    <text x="100" y="325" text-anchor="middle" font-size="12" fill="#4b5563">Marina (yachts)</text>
  </g>
</svg>
