<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A shop assistant scanning an item at a checkout</title>
  <desc id="desc">In a shop, an assistant behind the checkout holds a green box over a scanner. A customer stands on the other side of the counter holding a shopping bag. Shelves full of products are in the background.</desc>
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Floor -->
  <rect x="0" y="420" width="800" height="80" fill="#f3f4f6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#9ca3af" stroke-width="2"/>

  <!-- Shelves in the background -->
  <g fill="#9ca3af">
    <rect x="30" y="60" width="6" height="200"/>
    <rect x="300" y="60" width="6" height="200"/>
    <rect x="30" y="120" width="276" height="6"/>
    <rect x="30" y="190" width="276" height="6"/>
    <rect x="30" y="256" width="276" height="6"/>
  </g>
  <g stroke="#6b7280" stroke-width="1.5">
    <rect x="44" y="90" width="24" height="30" fill="#fca5a5"/>
    <rect x="74" y="90" width="24" height="30" fill="#fca5a5"/>
    <rect x="104" y="96" width="30" height="24" fill="#fde68a"/>
    <rect x="140" y="96" width="30" height="24" fill="#fde68a"/>
    <rect x="182" y="84" width="20" height="36" fill="#93c5fd"/>
    <rect x="208" y="84" width="20" height="36" fill="#93c5fd"/>
    <rect x="236" y="92" width="56" height="28" fill="#c4b5fd"/>
    <rect x="44" y="160" width="40" height="30" fill="#86efac"/>
    <rect x="90" y="160" width="40" height="30" fill="#86efac"/>
    <rect x="140" y="166" width="22" height="24" fill="#fdba74"/>
    <rect x="168" y="166" width="22" height="24" fill="#fdba74"/>
    <rect x="200" y="154" width="44" height="36" fill="#fca5a5"/>
    <rect x="250" y="160" width="44" height="30" fill="#93c5fd"/>
    <rect x="44" y="228" width="60" height="28" fill="#fde68a"/>
    <rect x="112" y="222" width="28" height="34" fill="#c4b5fd"/>
    <rect x="146" y="222" width="28" height="34" fill="#c4b5fd"/>
    <rect x="184" y="228" width="50" height="28" fill="#86efac"/>
    <rect x="242" y="226" width="50" height="30" fill="#fdba74"/>
  </g>

  <!-- Shop assistant (behind the counter) -->
  <circle cx="420" cy="196" r="22" fill="#e0ac69"/>
  <path d="M398 194 A22 22 0 0 1 442 194 Q420 178 398 194 Z" fill="#111827"/>
  <rect x="394" y="218" width="52" height="110" rx="10" fill="#dc2626"/>
  <rect x="404" y="236" width="18" height="10" rx="2" fill="#ffffff"/>
  <line x1="440" y1="236" x2="482" y2="282" stroke="#dc2626" stroke-width="11" stroke-linecap="round"/>
  <circle cx="486" cy="286" r="7" fill="#e0ac69"/>
  <!-- Green box held over the scanner -->
  <rect x="478" y="262" width="34" height="26" fill="#22c55e" stroke="#15803d" stroke-width="2"/>

  <!-- Counter -->
  <rect x="360" y="320" width="300" height="100" fill="#a47148"/>
  <rect x="360" y="312" width="300" height="10" fill="#4b5563"/>
  <!-- Scanner with red light -->
  <rect x="478" y="296" width="44" height="16" rx="2" fill="#111827"/>
  <line x1="484" y1="304" x2="516" y2="304" stroke="#ef4444" stroke-width="3"/>
  <!-- Till screen -->
  <rect x="380" y="270" width="6" height="42" fill="#4b5563"/>
  <rect x="362" y="248" width="44" height="30" rx="3" fill="#e5e7eb" stroke="#4b5563" stroke-width="2"/>

<g transform="translate(-20,0)">
  <!-- Customer (in front of the counter) -->
  <rect x="686" y="322" width="16" height="96" fill="#1f2937"/>
  <rect x="708" y="322" width="16" height="96" fill="#1f2937"/>
  <ellipse cx="692" cy="418" rx="13" ry="5" fill="#111827"/>
  <ellipse cx="716" cy="418" rx="13" ry="5" fill="#111827"/>
  <rect x="678" y="206" width="54" height="122" rx="12" fill="#0ea5e9"/>
  <circle cx="705" cy="182" r="22" fill="#f1c7a3"/>
  <path d="M683 180 A22 22 0 0 1 727 180 Q705 162 683 180 Z" fill="#92400e"/>
  <line x1="726" y1="226" x2="748" y2="300" stroke="#0ea5e9" stroke-width="11" stroke-linecap="round"/>
  <circle cx="749" cy="304" r="7" fill="#f1c7a3"/>
  <!-- Shopping bag -->
  <path d="M738 304 Q749 284 760 304" fill="none" stroke="#6b7280" stroke-width="3"/>
  <rect x="730" y="304" width="40" height="46" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  </g>
</svg>
