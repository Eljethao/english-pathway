<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="Inter, Helvetica, Arial, sans-serif">
  <title>How olive oil is produced</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>
  <rect width="900" height="500" fill="#ffffff"/>

  <!-- Farm / mill labels -->
  <text x="120" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="1">ON THE FARM</text>
  <text x="560" y="40" text-anchor="middle" font-size="13" font-weight="600" fill="#6b7280" letter-spacing="1">AT THE MILL (STAGES 2–8)</text>
  <line x1="230" y1="28" x2="230" y2="190" stroke="#9ca3af" stroke-width="1" stroke-dasharray="5 4"/>

  <!-- Row 1 -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="#ffffff">
    <rect x="30" y="60" width="180" height="110" rx="8"/>
    <rect x="250" y="60" width="180" height="110" rx="8"/>
    <rect x="470" y="60" width="180" height="110" rx="8"/>
    <rect x="690" y="60" width="180" height="110" rx="8"/>
    <rect x="690" y="270" width="180" height="110" rx="8"/>
    <rect x="470" y="270" width="180" height="110" rx="8"/>
    <rect x="250" y="270" width="180" height="110" rx="8"/>
    <rect x="30" y="270" width="180" height="110" rx="8"/>
    <rect x="690" y="420" width="180" height="62" rx="8" stroke-dasharray="5 4"/>
  </g>

  <!-- Step numbers -->
  <g fill="#ffffff" stroke="#6b7280" stroke-width="1.2">
    <circle cx="52" cy="82" r="13"/>
    <circle cx="272" cy="82" r="13"/>
    <circle cx="492" cy="82" r="13"/>
    <circle cx="712" cy="82" r="13"/>
    <circle cx="712" cy="292" r="13"/>
    <circle cx="492" cy="292" r="13"/>
    <circle cx="272" cy="292" r="13"/>
    <circle cx="52" cy="292" r="13"/>
  </g>
  <g font-size="13" font-weight="600" fill="#374151" text-anchor="middle">
    <text x="52" y="87">1</text>
    <text x="272" y="87">2</text>
    <text x="492" y="87">3</text>
    <text x="712" y="87">4</text>
    <text x="712" y="297">5</text>
    <text x="492" y="297">6</text>
    <text x="272" y="297">7</text>
    <text x="52" y="297">8</text>
  </g>

  <!-- Stage titles -->
  <g font-size="16" font-weight="700" fill="#111827">
    <text x="74" y="88">Harvesting</text>
    <text x="294" y="88">Washing</text>
    <text x="514" y="88">Crushing</text>
    <text x="734" y="88">Mixing</text>
    <text x="734" y="298">Separating</text>
    <text x="514" y="298">Storing</text>
    <text x="294" y="298">Filtering</text>
    <text x="74" y="298">Bottling</text>
  </g>

  <!-- Stage details -->
  <g font-size="13" fill="#4b5563">
    <text x="44" y="125">Olives picked from trees</text>
    <text x="44" y="145">October – December</text>

    <text x="264" y="125">Leaves and dirt</text>
    <text x="264" y="145">removed with water</text>

    <text x="484" y="125">Olives and stones</text>
    <text x="484" y="145">crushed into a paste</text>

    <text x="704" y="125">Paste stirred slowly</text>
    <text x="704" y="145">for 30–40 minutes</text>

    <text x="704" y="335">Centrifuge separates</text>
    <text x="704" y="355">oil, water and solids</text>

    <text x="484" y="330">Oil kept in steel tanks</text>
    <text x="484" y="348">for 4–6 weeks so that</text>
    <text x="484" y="366">sediment settles</text>

    <text x="264" y="335">Oil filtered</text>
    <text x="264" y="355">to make it clear</text>

    <text x="44" y="335">Bottled, labelled and</text>
    <text x="44" y="355">transported to shops</text>

    <text x="704" y="446">Solid waste</text>
    <text x="704" y="466">used as fuel or fertiliser</text>
  </g>

  <!-- Arrows -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arrow)">
    <line x1="212" y1="115" x2="246" y2="115"/>
    <line x1="432" y1="115" x2="466" y2="115"/>
    <line x1="652" y1="115" x2="686" y2="115"/>
    <line x1="780" y1="172" x2="780" y2="266"/>
    <line x1="688" y1="325" x2="654" y2="325"/>
    <line x1="468" y1="325" x2="434" y2="325"/>
    <line x1="248" y1="325" x2="214" y2="325"/>
  </g>
  <line x1="780" y1="382" x2="780" y2="416" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="790" y="404" font-size="12" fill="#6b7280">by-product</text>
</svg>
