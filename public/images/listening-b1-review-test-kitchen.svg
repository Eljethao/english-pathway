<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A chef cutting vegetables in a kitchen</title>
  <desc id="desc">In a kitchen, a chef in a white hat and jacket stands at a counter and cuts vegetables on a chopping board with a knife. A sink is on the left. Two pots are on a cooker on the right. Plates are on a shelf above. The cupboard doors are closed.</desc>
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Floor -->
  <rect x="0" y="420" width="800" height="80" fill="#f3f4f6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#9ca3af" stroke-width="2"/>

  <!-- Shelf with plates -->
  <rect x="200" y="110" width="320" height="8" fill="#9ca3af"/>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="2">
    <ellipse cx="240" cy="96" rx="22" ry="14"/>
    <ellipse cx="290" cy="96" rx="22" ry="14"/>
    <ellipse cx="340" cy="96" rx="22" ry="14"/>
    <ellipse cx="390" cy="96" rx="22" ry="14"/>
  </g>
  <g fill="#ffffff" stroke="#6b7280" stroke-width="2">
    <rect x="440" y="84" width="22" height="26"/>
    <rect x="470" y="84" width="22" height="26"/>
  </g>

  <!-- Counter with cupboards (doors closed) -->
  <rect x="40" y="320" width="560" height="100" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <rect x="34" y="310" width="572" height="12" fill="#6b7280"/>
  <g fill="none" stroke="#9ca3af" stroke-width="2">
    <rect x="60" y="334" width="110" height="76"/>
    <rect x="190" y="334" width="110" height="76"/>
    <rect x="320" y="334" width="110" height="76"/>
    <rect x="450" y="334" width="130" height="76"/>
  </g>
  <g fill="#6b7280">
    <rect x="155" y="364" width="6" height="16" rx="2"/>
    <rect x="198" y="364" width="6" height="16" rx="2"/>
    <rect x="415" y="364" width="6" height="16" rx="2"/>
    <rect x="458" y="364" width="6" height="16" rx="2"/>
  </g>

  <!-- Sink and tap on the left -->
  <rect x="62" y="304" width="110" height="10" rx="3" fill="#cbd5e1" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M110 304 L110 268 Q110 258 122 258 L134 258" fill="none" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>

  <!-- Chef -->
  <circle cx="330" cy="196" r="22" fill="#c68c5a"/>
  <rect x="312" y="150" width="36" height="30" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <ellipse cx="330" cy="150" rx="26" ry="14" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <rect x="302" y="218" width="56" height="94" rx="10" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <g fill="#9ca3af"><circle cx="322" cy="240" r="2.5"/><circle cx="338" cy="240" r="2.5"/><circle cx="322" cy="262" r="2.5"/><circle cx="338" cy="262" r="2.5"/></g>
  <line x1="306" y1="236" x2="288" y2="294" stroke="#9ca3af" stroke-width="15" stroke-linecap="round"/>
  <line x1="306" y1="236" x2="288" y2="294" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
  <line x1="354" y1="236" x2="372" y2="294" stroke="#9ca3af" stroke-width="15" stroke-linecap="round"/>
  <line x1="354" y1="236" x2="372" y2="294" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>

  <!-- Chopping board, vegetables, knife -->
  <rect x="262" y="298" width="140" height="12" rx="3" fill="#d6a86c" stroke="#a47148" stroke-width="1.5"/>
  <g fill="#f97316">
    <rect x="270" y="290" width="40" height="8" rx="4"/>
    <rect x="272" y="282" width="34" height="8" rx="4"/>
  </g>
  <g fill="#ef4444"><circle cx="320" cy="292" r="6"/><circle cx="334" cy="293" r="5"/></g>
  <circle cx="288" cy="296" r="6" fill="#c68c5a"/>
  <rect x="356" y="290" width="34" height="5" fill="#d1d5db" stroke="#6b7280" stroke-width="1"/>
  <rect x="372" y="288" width="16" height="9" rx="2" fill="#111827"/>
  <circle cx="374" cy="294" r="6" fill="#c68c5a"/>

  <!-- Cooker with two pots on the right -->
  <rect x="620" y="300" width="150" height="120" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <rect x="640" y="340" width="110" height="64" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <rect x="616" y="296" width="158" height="8" fill="#374151"/>
  <rect x="632" y="256" width="56" height="40" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <rect x="626" y="250" width="68" height="8" rx="3" fill="#6b7280"/>
  <rect x="704" y="264" width="54" height="32" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <line x1="758" y1="272" x2="784" y2="266" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>
</svg>
