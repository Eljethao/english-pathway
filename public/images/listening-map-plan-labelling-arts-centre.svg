<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 500" width="640" height="500" font-family="Arial, Helvetica, sans-serif">
  <title>Ground floor plan of Riverside Arts Centre with rooms labelled A to H</title>
  <rect width="640" height="500" fill="#ffffff"/>
  <text x="20" y="32" font-size="18" font-weight="bold" fill="#333333">Riverside Arts Centre: ground floor</text>
  <g transform="translate(0,20)">
    <!-- Rooms -->
    <g fill="#ffffff" stroke="#888888" stroke-width="1.2">
      <rect x="20" y="40" width="140" height="150"/>
      <rect x="160" y="40" width="190" height="150"/>
      <rect x="350" y="40" width="130" height="150"/>
      <rect x="480" y="40" width="140" height="150"/>
      <rect x="20" y="230" width="200" height="80"/>
      <rect x="220" y="230" width="70" height="80"/>
      <rect x="350" y="230" width="70" height="80"/>
      <rect x="420" y="230" width="200" height="80"/>
      <rect x="20" y="310" width="200" height="110"/>
      <rect x="420" y="310" width="200" height="110"/>
    </g>
    <!-- Stairs hatching -->
    <g stroke="#bbbbbb" stroke-width="1">
      <line x1="220" y1="245" x2="290" y2="245"/><line x1="220" y1="260" x2="290" y2="260"/>
      <line x1="220" y1="275" x2="290" y2="275"/><line x1="220" y1="290" x2="290" y2="290"/>
    </g>
    <!-- Lift cross -->
    <g stroke="#bbbbbb" stroke-width="1">
      <line x1="350" y1="230" x2="420" y2="310"/><line x1="420" y1="230" x2="350" y2="310"/>
    </g>
    <rect x="236" y="262" width="38" height="16" fill="#ffffff"/>
    <text x="255" y="275" font-size="11" fill="#555555" text-anchor="middle">Stairs</text>
    <rect x="371" y="262" width="28" height="16" fill="#ffffff"/>
    <text x="385" y="275" font-size="11" fill="#555555" text-anchor="middle">Lift</text>
    <!-- Corridor label -->
    <text x="320" y="214" font-size="11" font-style="italic" fill="#999999" text-anchor="middle">corridor</text>
    <!-- Reception desk -->
    <rect x="275" y="345" width="90" height="22" fill="#f5f5f5" stroke="#999999" stroke-width="1"/>
    <text x="320" y="360" font-size="11" fill="#555555" text-anchor="middle">Reception</text>
    <!-- Outer walls -->
    <rect x="20" y="40" width="600" height="380" fill="none" stroke="#666666" stroke-width="2"/>
    <!-- Entrance gap -->
    <rect x="296" y="417" width="48" height="6" fill="#ffffff"/>
    <polygon points="320,428 313,440 327,440" fill="#555555"/>
    <text x="320" y="458" font-size="12" fill="#555555" text-anchor="middle">Main entrance</text>
    <!-- Letters -->
    <g font-size="18" font-weight="bold" fill="#333333" text-anchor="middle">
      <text x="120" y="276">A</text>
      <text x="120" y="371">B</text>
      <text x="520" y="276">C</text>
      <text x="520" y="371">D</text>
      <text x="90" y="121">E</text>
      <text x="255" y="121">F</text>
      <text x="415" y="121">G</text>
      <text x="550" y="121">H</text>
    </g>
  </g>
</svg>
