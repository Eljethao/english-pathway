<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 510" width="680" height="510" font-family="Arial, Helvetica, sans-serif">
  <title>Cross-section of a house cooled by a windcatcher, with six numbered labels</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="680" height="510" fill="#ffffff"/>
  <text x="20" y="32" font-size="17" font-weight="bold" fill="#333333">Cross-section of a house cooled by a windcatcher</text>

  <!-- Underground area, with the basement and tunnel cut out -->
  <rect x="20" y="360" width="640" height="135" fill="#f3f4f6"/>
  <rect x="240" y="360" width="320" height="110" fill="#ffffff"/>
  <rect x="30" y="440" width="212" height="30" fill="#ffffff"/>
  <!-- Water in the tunnel and the pool -->
  <rect x="30" y="458" width="302" height="12" fill="#dbeafe"/>
  <rect x="330" y="446" width="170" height="24" fill="#dbeafe" stroke="#93a8bf" stroke-width="1"/>

  <!-- Ground level -->
  <g stroke="#9ca3af" stroke-width="1.2" fill="none">
    <line x1="20" y1="360" x2="240" y2="360"/>
    <line x1="620" y1="360" x2="660" y2="360"/>
  </g>
  <text x="26" y="352" font-size="12" font-style="italic" fill="#6b7280">ground level</text>

  <!-- Tower and house walls -->
  <g stroke="#6b7280" stroke-width="1.6" fill="none">
    <line x1="232" y1="70" x2="348" y2="70"/>
    <line x1="240" y1="70" x2="240" y2="88"/>
    <line x1="240" y1="142" x2="240" y2="440"/>
    <line x1="340" y1="70" x2="340" y2="88"/>
    <line x1="340" y1="142" x2="340" y2="240"/>
    <line x1="340" y1="240" x2="630" y2="240"/>
    <line x1="620" y1="240" x2="620" y2="360"/>
    <line x1="290" y1="360" x2="500" y2="360"/>
    <line x1="540" y1="360" x2="620" y2="360"/>
  </g>
  <!-- Internal dividing wall of the tower (continues down to the basement) -->
  <line x1="290" y1="72" x2="290" y2="360" stroke="#6b7280" stroke-width="1.2"/>
  <!-- Slats in the openings near the top of the tower -->
  <g stroke="#b5bcc6" stroke-width="1" fill="none">
    <line x1="234" y1="102" x2="246" y2="102"/>
    <line x1="234" y1="115" x2="246" y2="115"/>
    <line x1="234" y1="128" x2="246" y2="128"/>
    <line x1="334" y1="102" x2="346" y2="102"/>
    <line x1="334" y1="115" x2="346" y2="115"/>
    <line x1="334" y1="128" x2="346" y2="128"/>
  </g>

  <!-- Basement and tunnel walls -->
  <g stroke="#6b7280" stroke-width="1.3" fill="none">
    <line x1="560" y1="360" x2="560" y2="470"/>
    <line x1="240" y1="470" x2="560" y2="470"/>
    <line x1="30" y1="440" x2="240" y2="440"/>
    <line x1="30" y1="470" x2="240" y2="470"/>
  </g>

  <!-- Text labels -->
  <g font-size="12" font-style="italic" fill="#6b7280">
    <text x="112" y="232">windward side</text>
    <text x="352" y="232">leeward side</text>
    <text x="400" y="489" text-anchor="middle">basement</text>
    <text x="34" y="489">water flows from distant hills</text>
  </g>
  <text x="112" y="104" font-size="13" font-weight="bold" fill="#475569">wind</text>

  <!-- Airflow and water flow -->
  <g stroke="#475569" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="104" y1="115" x2="234" y2="115"/>
    <path d="M265 100 V420 Q265 432 277 432 H508 Q520 432 520 420 V332"/>
    <path d="M536 300 Q536 262 486 262 H340 Q315 262 315 236 V115 H398"/>
    <line x1="60" y1="452" x2="120" y2="452"/>
  </g>

  <!-- Leader lines -->
  <g stroke="#6b7280" stroke-width="1" fill="none">
    <line x1="214" y1="157" x2="239" y2="134"/>
    <line x1="373" y1="190" x2="291" y2="190"/>
    <line x1="598" y1="458" x2="501" y2="458"/>
    <line x1="150" y1="408" x2="150" y2="446"/>
  </g>
  <g fill="#6b7280">
    <circle cx="239" cy="134" r="2.5"/>
    <circle cx="291" cy="190" r="2.5"/>
    <circle cx="501" cy="458" r="2.5"/>
    <circle cx="150" cy="446" r="2.5"/>
  </g>

  <!-- Numbered labels -->
  <g fill="#ffffff" stroke="#374151" stroke-width="1.3">
    <circle cx="205" cy="166" r="12"/>
    <circle cx="385" cy="190" r="12"/>
    <circle cx="424" cy="115" r="12"/>
    <circle cx="420" cy="318" r="12"/>
    <circle cx="610" cy="458" r="12"/>
    <circle cx="150" cy="396" r="12"/>
  </g>
  <g font-size="13" font-weight="bold" fill="#111827" text-anchor="middle">
    <text x="205" y="171">1</text>
    <text x="385" y="195">2</text>
    <text x="424" y="120">3</text>
    <text x="420" y="323">4</text>
    <text x="610" y="463">5</text>
    <text x="150" y="401">6</text>
  </g>
</svg>
