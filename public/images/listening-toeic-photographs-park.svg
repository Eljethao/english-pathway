<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A person reading on a park bench, with a bicycle by a lamp post</title>
  <desc id="desc">In a park, a person sits on a wooden bench and reads a book. Two trees stand on the left. On the right, a bicycle leans against a lamp post. Nobody is riding it.</desc>
  <rect width="800" height="500" fill="#ffffff"/>
  <!-- Grass -->
  <rect x="0" y="410" width="800" height="90" fill="#ecf5e7"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#a3b899" stroke-width="2"/>

  <!-- Trees -->
  <rect x="82" y="250" width="18" height="162" fill="#8b5e34"/>
  <circle cx="91" cy="210" r="70" fill="#86c37a"/>
  <rect x="208" y="280" width="14" height="132" fill="#8b5e34"/>
  <circle cx="215" cy="245" r="52" fill="#a7d69b"/>

  <!-- Bench -->
  <rect x="300" y="282" width="220" height="12" rx="3" fill="#b07a45"/>
  <rect x="300" y="302" width="220" height="12" rx="3" fill="#b07a45"/>
  <rect x="292" y="338" width="236" height="12" rx="3" fill="#b07a45"/>
  <rect x="312" y="282" width="8" height="128" fill="#4b5563"/>
  <rect x="500" y="282" width="8" height="128" fill="#4b5563"/>

  <!-- Person sitting and reading (facing left) -->
  <rect x="444" y="242" width="48" height="100" rx="12" fill="#2563eb"/>
  <circle cx="466" cy="218" r="22" fill="#c68c5a"/>
  <path d="M444 216 A22 22 0 0 1 488 216 Q466 200 444 216 Z" fill="#1f2937"/>
  <rect x="396" y="324" width="70" height="20" rx="8" fill="#374151"/>
  <rect x="392" y="324" width="18" height="84" rx="6" fill="#374151"/>
  <ellipse cx="396" cy="410" rx="14" ry="5" fill="#111827"/>
  <line x1="450" y1="262" x2="420" y2="290" stroke="#2563eb" stroke-width="11" stroke-linecap="round"/>
  <!-- Open book -->
  <path d="M398 268 L418 276 L418 304 L398 296 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <path d="M418 276 L436 266 L436 294 L418 304 Z" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <circle cx="420" cy="292" r="6" fill="#c68c5a"/>

  <!-- Lamp post -->
  <rect x="576" y="110" width="9" height="300" fill="#374151"/>
  <rect x="562" y="92" width="37" height="24" rx="4" fill="#4b5563"/>
  <rect x="568" y="116" width="25" height="6" fill="#fde68a"/>

  <g transform="translate(-14,0)">
  <!-- Bicycle leaning against the lamp post -->
  <g fill="none" stroke="#b91c1c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="616,380 652,382 640,340 616,380"/>
    <polyline points="652,382 690,340 640,340"/>
    <line x1="690" y1="340" x2="712" y2="380"/>
    <line x1="690" y1="340" x2="684" y2="322"/>
    <line x1="676" y1="322" x2="696" y2="322"/>
    <line x1="640" y1="340" x2="636" y2="328"/>
  </g>
  <rect x="624" y="322" width="24" height="7" rx="3" fill="#111827"/>
  <circle cx="616" cy="380" r="29" fill="none" stroke="#111827" stroke-width="4"/>
  <circle cx="712" cy="380" r="29" fill="none" stroke="#111827" stroke-width="4"/>
  </g>
</svg>
