<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="title desc">
  <title id="title">A meeting in an office</title>
  <desc id="desc">A man stands at a whiteboard and points at a bar chart. Three colleagues sit at a meeting table and listen. On the right, a woman at a desk talks on the phone.</desc>
  <rect width="800" height="500" fill="#ffffff"/>

  <!-- Floor -->
  <rect x="0" y="420" width="800" height="80" fill="#f3f4f6"/>
  <line x1="0" y1="420" x2="800" y2="420" stroke="#9ca3af" stroke-width="2"/>

  <!-- Whiteboard with bar chart -->
  <rect x="50" y="60" width="230" height="150" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="4"/>
  <line x1="80" y1="80" x2="80" y2="190" stroke="#6b7280" stroke-width="2"/>
  <line x1="80" y1="190" x2="250" y2="190" stroke="#6b7280" stroke-width="2"/>
  <rect x="95" y="150" width="30" height="40" fill="#93c5fd"/>
  <rect x="145" y="120" width="30" height="70" fill="#60a5fa"/>
  <rect x="195" y="90" width="30" height="100" fill="#2563eb"/>

  <!-- Clock showing ten o'clock -->
  <circle cx="460" cy="90" r="26" fill="#ffffff" stroke="#6b7280" stroke-width="3"/>
  <line x1="460" y1="90" x2="446" y2="82" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
  <line x1="460" y1="90" x2="460" y2="69" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Window with city buildings -->
  <rect x="600" y="40" width="170" height="170" fill="#e0f2fe"/>
  <rect x="612" y="130" width="30" height="80" fill="#cbd5e1"/>
  <rect x="650" y="95" width="36" height="115" fill="#94a3b8"/>
  <rect x="694" y="140" width="26" height="70" fill="#cbd5e1"/>
  <rect x="726" y="110" width="32" height="100" fill="#94a3b8"/>
  <line x1="685" y1="40" x2="685" y2="210" stroke="#9ca3af" stroke-width="4"/>
  <rect x="600" y="40" width="170" height="170" fill="none" stroke="#9ca3af" stroke-width="4"/>

  <!-- Plant in the left corner -->
  <ellipse cx="28" cy="352" rx="9" ry="24" fill="#22c55e" transform="rotate(-25 28 352)"/>
  <ellipse cx="46" cy="352" rx="9" ry="24" fill="#16a34a" transform="rotate(25 46 352)"/>
  <ellipse cx="37" cy="345" rx="9" ry="28" fill="#4ade80"/>
  <polygon points="17,380 57,380 52,420 22,420" fill="#c2410c"/>

  <!-- Presenter -->
  <rect x="301" y="280" width="17" height="138" fill="#374151"/>
  <rect x="324" y="280" width="17" height="138" fill="#374151"/>
  <ellipse cx="307" cy="418" rx="13" ry="5" fill="#111827"/>
  <ellipse cx="333" cy="418" rx="13" ry="5" fill="#111827"/>
  <rect x="295" y="172" width="52" height="112" rx="10" fill="#1e3a8a"/>
  <circle cx="321" cy="150" r="22" fill="#c68c5a"/>
  <path d="M299 150 A22 22 0 0 1 343 150 Q321 132 299 150 Z" fill="#111827"/>
  <line x1="300" y1="188" x2="248" y2="140" stroke="#1e3a8a" stroke-width="11" stroke-linecap="round"/>
  <circle cx="245" cy="137" r="7" fill="#c68c5a"/>

  <!-- Seated colleague 1 (laptop) -->
  <rect x="387" y="244" width="46" height="44" rx="14" fill="#facc15"/>
  <circle cx="410" cy="255" r="21" fill="#f1c7a3"/>
  <path d="M389 255 A21 21 0 0 1 431 255 Q410 239 389 255 Z" fill="#facc15"/>
  <rect x="386" y="276" width="48" height="50" rx="10" fill="#f472b6"/>

  <!-- Seated colleague 2 (papers) -->
  <circle cx="490" cy="255" r="21" fill="#8d5524"/>
  <path d="M469 255 A21 21 0 0 1 511 255 Q490 237 469 255 Z" fill="#111827"/>
  <rect x="466" y="276" width="48" height="50" rx="10" fill="#a78bfa"/>

  <!-- Seated colleague 3 (mug) -->
  <rect x="547" y="244" width="46" height="40" rx="14" fill="#7c2d12"/>
  <circle cx="570" cy="255" r="21" fill="#e0ac69"/>
  <path d="M549 255 A21 21 0 0 1 591 255 Q570 239 549 255 Z" fill="#7c2d12"/>
  <rect x="546" y="276" width="48" height="50" rx="10" fill="#34d399"/>

  <!-- Meeting table -->
  <rect x="360" y="320" width="260" height="14" fill="#a47148"/>
  <rect x="372" y="334" width="12" height="86" fill="#a47148"/>
  <rect x="596" y="334" width="12" height="86" fill="#a47148"/>

  <!-- Items on the meeting table -->
  <rect x="390" y="288" width="40" height="28" rx="2" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>
  <rect x="384" y="315" width="52" height="5" fill="#4b5563"/>
  <rect x="470" y="313" width="40" height="7" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <rect x="474" y="309" width="36" height="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="584" y="300" width="16" height="20" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <path d="M600 304 a5 5 0 0 1 0 10" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Woman on the phone: chair -->
  <rect x="652" y="262" width="10" height="80" fill="#4b5563"/>
  <rect x="652" y="335" width="60" height="9" fill="#4b5563"/>
  <line x1="682" y1="344" x2="682" y2="410" stroke="#4b5563" stroke-width="5"/>
  <line x1="662" y1="418" x2="702" y2="418" stroke="#4b5563" stroke-width="5" stroke-linecap="round"/>

  <!-- Woman on the phone -->
  <rect x="667" y="246" width="46" height="46" rx="14" fill="#111827"/>
  <circle cx="690" cy="257" r="21" fill="#c68c5a"/>
  <path d="M669 257 A21 21 0 0 1 711 257 Q690 241 669 257 Z" fill="#111827"/>
  <rect x="666" y="278" width="48" height="60" rx="10" fill="#fb923c"/>
  <rect x="690" y="330" width="44" height="13" rx="5" fill="#374151"/>
  <rect x="722" y="336" width="13" height="80" fill="#374151"/>
  <line x1="704" y1="296" x2="710" y2="266" stroke="#fb923c" stroke-width="10" stroke-linecap="round"/>
  <rect x="705" y="243" width="9" height="22" rx="2" fill="#111827"/>

  <!-- Desk and computer -->
  <rect x="740" y="282" width="50" height="38" rx="3" fill="#374151"/>
  <rect x="760" y="320" width="10" height="10" fill="#4b5563"/>
  <rect x="700" y="330" width="96" height="12" fill="#a47148"/>
  <rect x="784" y="342" width="10" height="78" fill="#a47148"/>
</svg>
